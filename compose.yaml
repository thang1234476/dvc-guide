services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dvc_guide
      MYSQL_USER: dvcguide
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infrastructure/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=dvc_guide --execute='SELECT 1 FROM quan_tri_vien LIMIT 1' >/dev/null"]
      start_period: 30s
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build: ./ai-service
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-45}
    ports:
      - "127.0.0.1:${AI_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).close()"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build: ./server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_NAME: dvc_guide
      DB_USERNAME: dvcguide
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TIMEOUT_SECONDS: ${AI_SERVICE_TIMEOUT_SECONDS:-55}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8080/api/v1/health"]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 12

  admin-web:
    build: ./admin-web
    ports:
      - "127.0.0.1:${ADMIN_HOST_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama

volumes:
  mysql-data:
  ollama-data:
